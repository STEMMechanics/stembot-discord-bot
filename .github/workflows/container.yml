name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine build metadata
        id: build-info
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="$GITHUB_REF_NAME"
          version="development"
          release="unreleased"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            branch="$DEFAULT_BRANCH"
            version="${GITHUB_REF_NAME#v}"
            release="$GITHUB_REF_NAME"
          fi

          pull_request="$(git log -1 --pretty=%s | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')"
          if [[ -z "$pull_request" ]]; then
            pull_request="unknown"
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'branch=%s\n' "$branch"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'pr=%s\n' "$pull_request"
            printf 'release=%s\n' "$release"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_BRANCH=${{ steps.build-info.outputs.branch }}
            BUILD_COMMIT=${{ steps.build-info.outputs.commit }}
            BUILD_PR=${{ steps.build-info.outputs.pr }}
            BUILD_RELEASE=${{ steps.build-info.outputs.release }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
